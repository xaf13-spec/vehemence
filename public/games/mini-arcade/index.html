function clicker(){controls.hidden=true;canvas.style.display='none';var wrap=document.createElement('div');wrap.id='clicker';wrap.className='clicker';wrap.innerHTML='<div class="click-main"><div class="emoji" id="big">'+d[2]+'</div><div class="num" id="coins">0</div><div class="muted" id="unit">coins</div><button class="btn primary" id="tap">TAP</button></div><div><div class="eyebrow" style="margin-bottom:10px">UPGRADES</div><div class="upgrades" id="upgradeList"></div><p class="muted">Auto production runs while this game is open.</p><button class="btn" id="resetSave">Reset save</button></div>';el('stage').insertBefore(wrap,overlay);try{clickState=JSON.parse(localStorage.getItem('vh-click-'+mode)||'null')}catch(e){}clickState=clickState||{coins:0,power:1,owned:[0,0,0]};var ups=[['Better taps','More per click',25,1],['Auto tapper','Passive production',100,3],['Factory','Big production boost',500,15]];function paint(){el('coins').textContent=Math.floor(clickState.coins).toLocaleString();el('score').textContent=Math.floor(clickState.coins).toLocaleString();el('unit').textContent='per tap: '+clickState.power;var list=el('upgradeList');list.innerHTML='';ups.forEach(function(u,i){var cost=Math.floor(u[2]*Math.pow(1.65,clickState.owned[i]));var b=document.createElement('button');b.className='upgrade';b.disabled=clickState.coins<cost;b.innerHTML='<span><strong>'+u[0]+'</strong><small>'+u[1]+' · owned '+clickState.owned[i]+'</small></span><span class="cost">'+cost+'</span>';b.onclick=function(){if(clickState.coins<cost)return;clickState.coins-=cost;clickState.owned[i]++;clickState.power+=u[3];paint()};list.appendChild(b)});localStorage.setItem('vh-click-'+mode,JSON.stringify(clickState))}function tap(){clickState.coins+=clickState.power;paint()}el('tap').onclick=tap;el('big').onclick=tap;el('resetSave').onclick=function(){if(confirm('Reset this game save?')){clickState={coins:0,power:1,owned:[0,0,0]};paint()}};if(window.vhIdle)clearInterval(window.vhIdle);window.vhIdle=setIn
