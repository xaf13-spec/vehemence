<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake | Browser Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--panel:#171728;--line:#2a2a45;--text:#e8e8f5;--muted:#8b8ba8;--neon:#33ff99}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:26px;letter-spacing:.15em;color:var(--neon);margin-bottom:6px;text-shadow:0 0 20px rgba(51,255,153,.4)}
.scorebar{display:flex;gap:28px;font-family:"Consolas",monospace;font-size:16px;margin-bottom:14px;color:var(--muted)}
.scorebar b{color:var(--text)}
#board{
  background:var(--panel);
  border:2px solid var(--neon);
  border-radius:10px;
  box-shadow:0 0 40px -8px rgba(51,255,153,.35), inset 0 0 60px rgba(0,0,0,.5);
}
.controls{margin-top:18px;font-size:14px;color:var(--muted);text-align:center;line-height:1.7}
.controls kbd{font-family:"Consolas",monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--text);font-size:12px}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;backdrop-filter:blur(4px)}
#overlay h2{font-size:clamp(30px,6vw,48px);color:var(--neon);text-shadow:0 0 30px rgba(51,255,153,.5)}
#overlay p{color:var(--muted);font-size:16px}
#overlay button{font-family:"Consolas",monospace;font-size:16px;letter-spacing:.2em;padding:14px 34px;background:transparent;border:2px solid var(--neon);color:var(--neon);border-radius:8px;cursor:pointer;transition:.2s}
#overlay button:hover{background:var(--neon);color:var(--bg);box-shadow:0 0 30px rgba(51,255,153,.5)}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>SNAKE</h1>
<div class="scorebar"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<canvas id="board" width="420" height="420"></canvas>
<div class="controls">
  <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer &middot; <kbd>Space</kbd> pause<br>
  Touch: swipe on the board to steer
</div>

<div id="overlay">
  <h2>GAME OVER</h2>
  <p id="final">You scored <b>0</b></p>
  <button id="restart">PLAY AGAIN</button>
</div>

<script>
const cv=document.getElementById('board'),ctx=cv.getContext('2d');
const CELL=20,N=cv.width/CELL;
let snake,grow,dir,q,score,best,gameOver,paused,tick,speed;

function loadBest(){return parseInt(localStorage.getItem('snake_best')||'0',10)}
function saveBest(v){localStorage.setItem('snake_best',v)}

function init(){
  snake=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];
  grow=0;dir={x:1,y:0};q={x:1,y:0};
  score=0;gameOver=false;paused=false;tick=0;speed=130;
  best=Math.max(best||0,loadBest());
  placeFood();updateHud();document.getElementById('overlay').classList.add('hidden');draw();
  document.getElementById('final').textContent='';
}
function placeFood(){
  let p;
  do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}
function updateHud(){
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#0f0f1e';
  ctx.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){if((i+j)%2===0){ctx.fillStyle='rgba(255,255,255,.02)';ctx.fillRect(i*CELL,j*CELL,CELL,CELL)}}
  ctx.fillStyle='#ff4d6d';
  ctx.shadowColor='#ff4d6d';ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-3,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  snake.forEach((s,i)=>{
    const g=i===0?1:i/snake.length;
    ctx.fillStyle=i===0?'#33ff99':'#1fbf6a';
    ctx.shadowColor='#33ff99';ctx.shadowBlur=i===0?14:4;
    ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
  });
  ctx.shadowBlur=0;
  if(paused&&!gameOver){
    ctx.fillStyle='rgba(10,10,20,.7)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#e8e8f5';ctx.font='bold 28px Consolas';ctx.textAlign='center';ctx.fillText('PAUSED',cv.width/2,cv.height/2);
  }
}
function step(){
  if(gameOver||paused)return;
  dir=q;
  const h=snake[0];
  const nh={x:h.x+dir.x,y:h.y+dir.y};
  const hitWall=nh.x<0||nh.y<0||nh.x>=N||nh.y>=N;
  const hitSelf=snake.some(s=>s.x===nh.x&&s.y===nh.y);
  if(hitWall||hitSelf){
    gameOver=true;
    best=Math.max(best,score);saveBest(best);updateHud();
    document.getElementById('final').innerHTML='You scored <b>'+score+'</b>'+(best>0?' &middot; Best <b>'+best+'</b>':'');
    document.getElementById('overlay').classList.remove('hidden');
    return;
  }
  snake.unshift(nh);
  if(nh.x===food.x&&nh.y===food.y){score+=10;grow++;speed=Math.max(60,speed-2);placeFood();updateHud()}
  else if(grow>0){grow--}
  else{snake.pop()}
  draw();
}
function loop(){tick++;if(tick%(Math.max(1,speed/16|0))===0)step();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='Spacebar'){e.preventDefault();paused=!paused;draw();return}
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  const d=m[k.toLowerCase()]||m[k];
  if(!d)return;
  e.preventDefault();
  if(gameOver){init();return}
  if(d.x!==-dir.x||d.y!==-dir.y)q=d;
});
let ts=null;
cv.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
cv.addEventListener('touchend',e=>{
  if(!ts)return;
  const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;
  ts=null;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))q=dx>0?{x:1,y:0}:{x:-1,y:0};
  else q=dy>0?{x:0,y:1}:{x:0,y:-1};
});
document.getElementById('restart').addEventListener('click',init);
best=loadBest();init();loop();
</script>
</body>
</html>
