<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Circle Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="difficulty-selection">
    <h2>Select Difficulty</h2>
    <button class="difficulty-button" data-level="easy">Easy</button>
    <button class="difficulty-button" data-level="medium">Medium</button>
    <button class="difficulty-button" data-level="hard">Hard</button>
  </div>

  <div id="score-tab">
    Score: <span id="score">0</span> | High Score: <span id="high-score">0</span> | Difficulty: <span id="level">Easy</span>
  </div>

  <div id="game-container"></div>
  <button id="start-button" class="hidden">Start Game</button>
  <script src="script.js"></script>
</body>
</html>
