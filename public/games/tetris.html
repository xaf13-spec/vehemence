<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tetris</title>
<style>
:root{color-scheme:dark;--bg:#0b0d15;--panel:#121624;--line:#272d42;--text:#f3f5ff;--muted:#9ca6c2;--accent:#a78bfa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a1d35 0%,var(--bg) 55%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}
main{width:min(760px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:clamp(26px,5vw,38px);margin:0;letter-spacing:-1.5px}header p{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;color:var(--text);background:#20263a;border:1px solid #343c57;border-radius:10px;padding:10px 14px;cursor:pointer}button:hover{background:#2a3150}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:16px;align-items:start}.board-wrap{background:#080a11;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;justify-content:center;position:relative}
canvas{display:block;width:min(100%,300px);height:auto;image-rendering:pixelated;border-radius:8px}.side{display:grid;gap:12px}.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:14px}.label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.value{font-size:27px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}.next-canvas{width:100%;max-width:140px;margin:8px auto 0}.controls{display:grid;gap:8px}.controls p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.controls strong{color:var(--text);font-weight:600}.mobile-controls{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mobile-controls button{padding:13px 0;font-size:18px}.overlay{position:absolute;inset:12px;background:#080a11dc;display:grid;place-items:center;text-align:center;border-radius:8px;padding:20px}.overlay[hidden]{display:none}.overlay h2{margin:0 0 8px;font-size:26px}.overlay p{margin:0 0 16px;color:var(--muted)}footer{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
@media(max-width:560px){body{padding:12px}.layout{grid-template-columns:minmax(0,1fr) 104px;gap:8px}.board-wrap{padding:6px}.side{gap:8px}.panel{padding:9px}.value{font-size:20px}.label{font-size:9px;letter-spacing:1px}.controls{display:none}.mobile-controls{display:grid}.next-canvas{width:100%}header p{font-size:12px}header button{padding:8px 10px;font-size:12px}}
</style>
</head>
<body>
<main>
<header><div><h1>tetris</h1><p>fit the pieces. clear the lines.</p></div><button id="pauseBtn" type="button">pause</button></header>
<div class="layout">
<div class="board-wrap"><canvas id="board" width="300" height="600" aria-label="Tetris playfield"></canvas><div class="overlay" id="overlay"><div><h2 id="overlayTitle">ready?</h2><p id="overlayText">use the arrow keys to play</p><button id="startBtn" type="button">start game</button></div></div></div>
<aside class="side">
<div class="panel"><div class="label">score</div><div class="value" id="score">0</div></div>
<div class="panel"><div class="label">lines</div><div class="value" id="lines">0</div></div>
<div class="panel"><div class="label">level</div><div class="value" id="level">1</div></div>
<div class="panel"><div class="label">next</div><canvas id="next" class="next-canvas" width="140" height="100" aria-label="Next piece"></canvas></div>
<div class="panel controls"><div class="label">controls</div><p><strong>← →</strong> move<br><strong>↑ / X</strong> rotate<br><strong>↓</strong> soft drop<br><strong>space</strong> hard drop<br><strong>P / Esc</strong> pause</p></div>
</aside>
</div>
<div class="mobile-controls"><button data-action="left" aria-label="Move left">←</button><button data-action="rotate" aria-label="Rotate">↻</button><button data-action="down" aria-label="Soft drop">↓</button><button data-action="right" aria-label="Move right">→</button></div>
<footer>keyboard or touch controls · no downloads</footer>
</main>
<script>
(() => {
const COLS=10,ROWS=20,SIZE=30;
const COLORS={I:"#55d9e8",O:"#f6d365",T:"#b69cff",S:"#6ee7a8",Z:"#ff7d9c",J:"#76a7ff",L:"#ffb36b"};
const SHAPES={
I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]
};
const boardCanvas=document.getElementById("board"),ctx=boardCanvas.getContext("2d"),nextCanvas=document.getElementById("next"),nctx=nextCanvas.getContext("2d");
const overlay=document.getElementById("overlay"),overlayTitle=document.getElementById("overlayTitle"),overlayText=document.getElementById("overlayText");
let grid, piece, nextType, score, lines, level, running=false, paused=false, over=false, last=0, dropTimer=0, raf=0;
function newGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(""))}
function randomType(){return Object.keys(SHAPES)[Math.floor(Math.random()*7)]}
function copyShape(type){return SHAPES[type].map(row=>row.slice())}
function spawn(){const type=nextType||randomType();nextType=randomType();piece={type,shape:copyShape(type),x:Math.floor((COLS-SHAPES[type][0].length)/2),y:0};drawNext();if(collides(piece.x,piece.y,piece.shape)){over=true;running=false;showOverlay("game over","final score: "+score,"play again")}}
function collides(x,y,shape){for(let r=0;r<shape.length;r++)for(let c=0;c<shape[r].length;c++)if(shape[r][c]){const nx=x+c,ny=y+r;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&grid[ny][nx]))return true}return false}
function lock(){piece.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v&&piece.y+r>=0)grid[piece.y+r][piece.x+c]=piece.type}));let cleared=0;for(let r=ROWS-1;r>=0;r--){if(grid[r].every(Boolean)){grid.splice(r,1);grid.unshift(Array(COLS).fill(""));cleared++;r++}}if(cleared){score+=([0,100,300,500,800][cleared]||800)*level;lines+=cleared;level=Math.floor(lines/10)+1;updateStats()}spawn()}
function rotate(shape){return shape[0].map((_,i)=>shape.map(row=>row[i]).reverse())}
function move(dx,dy){if(!running||paused||over)return false;if(!collides(piece.x+dx,piece.y+dy,piece.shape)){piece.x+=dx;piece.y+=dy;return true}if(dy===1)lock();return false}
function hardDrop(){if(!running||paused||over)return;let d=0;while(!collides(piece.x,piece.y+1,piece.shape)){piece.y++;d++}score+=d*2;updateStats();lock()}
function turn(){if(!running||paused||over)return;const rotated=rotate(piece.shape);for(const offset of [0,-1,1,-2,2])if(!collides(piece.x+offset,piece.y,rotated)){piece.x+=offset;piece.shape=rotated;break}}
function cell(g,x,y,color,alpha=1){g.globalAlpha=alpha;g.fillStyle=color;g.fillRect(x+1,y+1,SIZE-2,SIZE-2);g.fillStyle="rgba(255,255,255,.17)";g.fillRect(x+3,y+3,SIZE-6,3);g.globalAlpha=1}
function draw(){ctx.clearRect(0,0,300,600);ctx.fillStyle="#0b0e18";ctx.fillRect(0,0,300,600);ctx.strokeStyle="#1b2030";ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*SIZE+.5,0);ctx.lineTo(x*SIZE+.5,600);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*SIZE+.5);ctx.lineTo(300,y*SIZE+.5);ctx.stroke()}grid.forEach((row,y)=>row.forEach((v,x)=>{if(v)cell(ctx,x*SIZE,y*SIZE,COLORS[v])}));if(piece){piece.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v){const x=piece.x+c,y=piece.y+r;if(y>=0)cell(ctx,x*SIZE,y*SIZE,COLORS[piece.type]);}}));let gy=piece.y;while(!collides(piece.x,gy+1,piece.shape))gy++;if(gy!==piece.y)piece.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v&&gy+r>=0)cell(ctx,(piece.x+c)*SIZE,(gy+r)*SIZE,COLORS[piece.type],.22)}))}
}
function drawNext(){nctx.clearRect(0,0,140,100);if(!nextType)return;const s=copyShape(nextType),size=22,w=s[0].length*size,h=s.length*size,ox=(140-w)/2,oy=(100-h)/2;s.forEach((row,y)=>row.forEach((v,x)=>{if(v){nctx.fillStyle=COLORS[nextType];nctx.fillRect(ox+x*size+1,oy+y*size+1,size-3,size-3);nctx.fillStyle="rgba(255,255,255,.2)";nctx.fillRect(ox+x*size+3,oy+y*size+3,size-7,3)}}))}
function updateStats(){document.getElementById("score").textContent=score;document.getElementById("lines").textContent=lines;document.getElementById("level").textContent=level}
function showOverlay(title,sub,button){overlayTitle.textContent=title;overlayText.textContent=sub;document.getElementById("startBtn").textContent=button;overlay.hidden=false}
function start(){cancelAnimationFrame(raf);grid=newGrid();score=0;lines=0;level=1;over=false;paused=false;running=true;nextType=randomType();updateStats();spawn();overlay.hidden=true;last=0;dropTimer=0;raf=requestAnimationFrame(loop)}
function togglePause(){if(over||!grid)return;if(!running){return}paused=!paused;if(paused)showOverlay("paused","take your time","resume");else{overlay.hidden=true;last=0;raf=requestAnimationFrame(loop)}document.getElementById("pauseBtn").textContent=paused?"resume":"pause"}
function loop(time){if(!running||paused)return;const dt=last?time-last:0;last=time;dropTimer+=dt;if(dropTimer>Math.max(90,750-(level-1)*55)){move(0,1);dropTimer=0}draw();raf=requestAnimationFrame(loop)}
document.getElementById("startBtn").addEventListener("click",()=>{if(paused&&!over){paused=false;overlay.hidden=true;document.getElementById("pauseBtn").textContent="pause";last=0;raf=requestAnimationFrame(loop)}else start()});
document.getElementById("pauseBtn").addEventListener("click",togglePause);
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowleft","arrowright","arrowdown","arrowup"," "].includes(k))e.preventDefault();if(k==="p"||k==="escape"){togglePause();return}if(!running||paused||over)return;if(k==="arrowleft")move(-1,0);else if(k==="arrowright")move(1,0);else if(k==="arrowdown"){if(move(0,1)){score++;updateStats()}}else if(k==="arrowup"||k==="x")turn();else if(k===" " )hardDrop();draw()});
document.querySelectorAll("[data-action]").forEach(b=>{const act=()=>{if(b.dataset.action==="left")move(-1,0);if(b.dataset.action==="right")move(1,0);if(b.dataset.action==="down"){if(move(0,1)){score++;updateStats()}}if(b.dataset.action==="rotate")turn();draw()};b.addEventListener("click",act);b.addEventListener("touchstart",e=>{e.preventDefault();act()},{passive:false})});
grid=newGrid();draw();drawNext();showOverlay("ready?","use the arrow keys to play","start game");
})();
</script>
</body>
</html>
