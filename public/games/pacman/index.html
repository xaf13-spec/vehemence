<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pac-Man — Vehemence</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b16;color:#f8fafc;font:14px system-ui,sans-serif}.wrap{width:min(94vw,700px);padding:22px;border:1px solid #202d52;border-radius:18px;background:#0c1224;box-shadow:0 20px 70px #0008}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}h1{font-size:22px;margin:0}p{color:#9ba9c9;margin:5px 0 0}#score{font-size:16px;font-weight:800;color:#ffe45e}canvas{display:block;width:100%;max-height:68vh;object-fit:contain;background:#050713;border:1px solid #17234a;border-radius:10px;image-rendering:pixelated}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;color:#a8b5d1}button{border:1px solid #30416f;border-radius:9px;padding:9px 13px;background:#172342;color:#fff;cursor:pointer}button:hover{background:#23345e}.hint{font-size:12px}
</style>
</head>
<body><main class="wrap"><header><div><h1>Pac-Man</h1><p>Clear the dots. Avoid the ghosts.</p></div><div id="score">Score: 0</div></header><canvas id="game" width="448" height="496" aria-label="Pac-Man game"></canvas><footer><span class="hint">Arrow keys / WASD to move · P to pause</span><button id="restart">Restart</button></footer></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score');const raw=['#####################','#.........#.........#','#.###.###.#.###.###.#','#o###.###.#.###.###o#','#...................#','#.###.#.#####.#.###.#','#.....#...#...#.....#','#####.### # ###.#####','#.....#       #.....#','#####.# ## ## #.#####','#.........#.........#','#.###.###.#.###.###.#','#o..#.....P.....#..o#','###.#.#.#####.#.#.###','#.....#...G...#.....#','#.#####.## ##.#####.#','#.........#.........#','#.###.###.#.###.###.#','#...#.....G.....#...#','###.#.#.#####.#.#.###','#.........#.........#','#####################'];const tile=20,rows=raw.length,cols=Math.max(...raw.map(r=>r.length));let map,player,ghosts,score,paused,over,won,dir,nextDir,timer;
function reset(){map=raw.map(r=>r.padEnd(cols,'#').split(''));player={x:10,y:12};map[12][10]=' ';ghosts=[{x:10,y:14,homeX:10,homeY:14,color:'#ff5578',dir:[1,0]},{x:10,y:18,homeX:10,homeY:18,color:'#ff9f43',dir:[-1,0]}];score=0;paused=false;over=false;won=false;dir=[0,0];nextDir=[0,0];draw();scoreEl.textContent='Score: 0';clearInterval(timer);timer=setInterval(step,145)}
function wall(x1,y1){return !map[y1]||map[y1][x1]==='#'||map[y1][x1]===undefined}
function move(entity,d){let nx=entity.x+d[0],ny=entity.y+d[1];if(!wall(nx,ny)){entity.x=nx;entity.y=ny;return true}return false}
function step(){if(paused||over)return;if(move(player,nextDir))dir=nextDir.slice();else move(player,dir);let cell=map[player.y][player.x];if(cell==='.'||cell==='o'){score+=cell==='o'?50:10;map[player.y][player.x]=' ';scoreEl.textContent='Score: '+score}
for(const g of ghosts){if(Math.random()<.55||wall(g.x+g.dir[0],g.y+g.dir[1])){const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>!wall(g.x+d[0],g.y+d[1]));if(opts.length)g.dir=opts[Math.floor(Math.random()*opts.length)]}move(g,g.dir);if(g.x===player.x&&g.y===player.y){over=true;}}
if(over){draw();overlay('Game over','Press Restart to try again');return}if(!map.some(r=>r.some(v=>v==='.'||v==='o'))){over=true;won=true;draw();overlay('You win!','Press Restart to play again');return}draw()}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#050713';x.fillRect(0,0,c.width,c.height);for(let y=0;y<rows;y++)for(let xx=0;xx<cols;xx++){let v=map[y][xx],px=xx*tile,py=y*tile;if(v==='#'){x.fillStyle='#142b85';x.fillRect(px+1,py+1,tile-2,tile-2);x.strokeStyle='#315aff';x.strokeRect(px+3,py+3,tile-6,tile-6)}else if(v==='.'||v==='o'){x.fillStyle=v==='o'?'#fff2a8':'#e9edff';x.beginPath();x.arc(px+tile/2,py+tile/2,v==='o'?4:2,0,Math.PI*2);x.fill()}}
x.fillStyle='#ffe23d';x.beginPath();x.arc(player.x*tile+tile/2,player.y*tile+tile/2,8,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(player.x*tile+13,player.y*tile+7,1.5,0,Math.PI*2);x.fill();for(const g of ghosts){x.fillStyle=g.color;x.beginPath();x.arc(g.x*tile+10,g.y*tile+10,8,Math.PI,0);x.lineTo(g.x*tile+18,g.y*tile+17);x.lineTo(g.x*tile+14,g.y*tile+14);x.lineTo(g.x*tile+10,g.y*tile+17);x.lineTo(g.x*tile+6,g.y*tile+14);x.lineTo(g.x*tile+2,g.y*tile+17);x.lineTo(g.x*tile+2,g.y*tile+10);x.fill();x.fillStyle='#fff';x.fillRect(g.x*tile+6,g.y*tile+7,3,4);x.fillRect(g.x*tile+12,g.y*tile+7,3,4);x.fillStyle='#18244d';x.fillRect(g.x*tile+7,g.y*tile+8,2,3);x.fillRect(g.x*tile+13,g.y*tile+8,2,3)}}
function overlay(title,sub){x.fillStyle='#050713dd';x.fillRect(0,0,c.width,c.height);x.textAlign='center';x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText(title,c.width/2,c.height/2-8);x.fillStyle='#b9c5e4';x.font='14px system-ui';x.fillText(sub,c.width/2,c.height/2+22)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(dirs[k]){e.preventDefault();nextDir=dirs[k]}if(k==='p'&&!over){paused=!paused;if(paused)overlay('Paused','Press P to continue');else draw()}});document.querySelector('#restart').addEventListener('click',reset);reset()})();
</script></body></html>
