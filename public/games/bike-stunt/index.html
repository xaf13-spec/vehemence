<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bike Stunt Racer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font:15px system-ui,sans-serif;display:flex;min-height:100vh;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#111827;border-bottom:1px solid #334155}h1{font-size:18px;margin:0}#hud{display:flex;gap:16px;font-size:13px;color:#cbd5e1}canvas{display:block;width:100%;max-height:calc(100vh - 125px);aspect-ratio:16/9;object-fit:contain;background:#8bd3ef;touch-action:none}footer{display:flex;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap;background:#111827}button{border:1px solid #475569;border-radius:9px;padding:10px 15px;background:#1e293b;color:#fff;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}.hint{padding:8px;text-align:center;color:#cbd5e1;font-size:12px}
</style></head>
<body><header><h1 id="title">Bike Stunt Racer</h1><div id="hud"><span>Level <b id="level">1</b>/3</span><span>Time <b id="time">0.0</b>s</span></div></header>
<canvas id="game" width="960" height="540" aria-label="Bike stunt racing game"></canvas>
<div class="hint">Keyboard: ← → or A/D to ride · Space to jump · R to restart</div>
<footer><button id="restart">Restart level</button><button id="next">Next level →</button></footer>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),params=new URLSearchParams(location.search),theme=params.get('theme')||'classic';
const themes={classic:{sky:'#8bd3ef',ground:'#4d7c0f',accent:'#f97316',label:'Bike Stunt Racer'},winter:{sky:'#cfe8ff',ground:'#e2e8f0',accent:'#2563eb',label:'Snow Bike Stunts'},pool:{sky:'#67e8f9',ground:'#0f766e',accent:'#fb7185',label:'Summer Bike Stunts'}};
const pal=themes[theme]||themes.classic;document.querySelector('#title').textContent=pal.label;
let level=1,started=performance.now(),elapsed=0,done=false,keys={},bike={x:70,y:340,vx:0,vy:0,angle:0,onGround:false};
function groundY(x){return 410+Math.sin(x/115)*18+(Math.sin(x/43)*7)+(x%620>350&&x%620<460?-Math.sin((x%620-350)/110*Math.PI)*58:0)}
function reset(){bike={x:70,y:groundY(70)-23,vx:0,vy:0,angle:0,onGround:true};started=performance.now();elapsed=0;done=false}
function drawBike(){ctx.save();ctx.translate(bike.x,bike.y);ctx.rotate(bike.angle);ctx.strokeStyle='#111827';ctx.lineWidth=5;ctx.beginPath();ctx.arc(-22,12,13,0,Math.PI*2);ctx.arc(22,12,13,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=pal.accent;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-22,12);ctx.lineTo(-5,-5);ctx.lineTo(8,12);ctx.lineTo(22,12);ctx.lineTo(8,-8);ctx.lineTo(-5,-5);ctx.stroke();ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(-5,-21,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f8fafc';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-5,-13);ctx.lineTo(3,0);ctx.lineTo(12,-7);ctx.moveTo(2,-1);ctx.lineTo(-8,7);ctx.stroke();ctx.restore()}
function draw(){const w=960,h=540;ctx.clearRect(0,0,w,h);ctx.fillStyle=pal.sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,.45)';for(let i=0;i<6;i++){let x=(i*190-(bike.x*.12)%190);ctx.beginPath();ctx.ellipse(x+50,90+i%3*34,40,12,0,0,Math.PI*2);ctx.fill()}ctx.save();ctx.translate(-bike.x+160,0);ctx.fillStyle=pal.ground;ctx.beginPath();ctx.moveTo(-100,540);for(let x=-100;x<bike.x+1000;x+=8)ctx.lineTo(x,groundY(x));ctx.lineTo(bike.x+1000,540);ctx.closePath();ctx.fill();ctx.strokeStyle='#1f2937';ctx.lineWidth=5;ctx.beginPath();for(let x=-100;x<bike.x+1000;x+=8){if(x===-100)ctx.moveTo(x,groundY(x));else ctx.lineTo(x,groundY(x))}ctx.stroke();ctx.fillStyle='#facc15';for(let i=1;i<=3;i++){let x=350+i*180;ctx.fillRect(x,groundY(x)-40,7,40);ctx.beginPath();ctx.moveTo(x+7,groundY(x)-40);ctx.lineTo(x+45,groundY(x)-28);ctx.lineTo(x+7,groundY(x)-16);ctx.fill()}ctx.fillStyle='#dc2626';ctx.fillRect(bike.x+790,groundY(bike.x+790)-68,8,68);ctx.fillStyle='#fff';ctx.fillRect(bike.x+798,groundY(bike.x+790)-68,35,20);ctx.restore();drawBike();if(done){ctx.fillStyle='rgba(15,23,42,.76)';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px system-ui';ctx.fillText('LEVEL COMPLETE!',w/2,h/2-12);ctx.font='20px system-ui';ctx.fillText('Hit Next Level to keep riding',w/2,h/2+30)}}
function frame(now){const dt=Math.min((now-(frame.last||now))/16.67,2);frame.last=now;if(!done){elapsed=(now-started)/1000;document.querySelector('#time').textContent=elapsed.toFixed(1);if(keys.ArrowRight||keys.d)bike.vx=Math.min(bike.vx+.14*dt,6.4);else if(keys.ArrowLeft||keys.a)bike.vx=Math.max(bike.vx-.17*dt,-2.5);else bike.vx*=Math.pow(.985,dt);if((keys[' ']||keys.ArrowUp||keys.w)&&bike.onGround){bike.vy=-8.4;bike.onGround=false}bike.vy+=.32*dt;bike.x+=bike.vx*dt;bike.y+=bike.vy*dt;bike.angle=Math.max(-.65,Math.min(.65,bike.vy*.06));let gy=groundY(bike.x)-23;if(bike.y>=gy){bike.y=gy;bike.vy=0;bike.onGround=true;bike.angle*=.55}if(bike.x>level*600+130){done=true;bike.vx=0}}document.querySelector('#level').textContent=level;draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key.toLowerCase()==='r')reset()});window.addEventListener('keyup',e=>keys[e.key]=false);document.querySelector('#restart').onclick=reset;document.querySelector('#next').onclick=()=>{level=level%3+1;reset()};canvas.addEventListener('pointerdown',e=>{keys[' ']=true});canvas.addEventListener('pointerup',()=>keys[' ']=false);reset();requestAnimationFrame(frame);
</script></body></html>
