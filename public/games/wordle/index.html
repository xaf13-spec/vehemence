<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle | Browser Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅰️</text></svg>">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--panel:#171728;--line:#2a2a45;--text:#e8e8f5;--muted:#8b8ba8;--neon:#66ffa0;--green:#3aa76d;--yellow:#b59f3b;--gray:#3a3a52}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:28px;letter-spacing:.15em;color:var(--neon);margin-bottom:8px;text-shadow:0 0 20px rgba(102,255,160,.4)}
.stats{display:flex;gap:24px;font-family:"Consolas",monospace;font-size:14px;margin-bottom:14px;color:var(--muted)}
.stats b{color:var(--text)}
.board{display:grid;grid-template-rows:repeat(6,56px);gap:8px;margin-bottom:16px}
.row{display:grid;grid-template-columns:repeat(5,56px);gap:8px}
.cell{border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"Consolas",monospace;font-size:28px;font-weight:700;text-transform:uppercase;transition:all .2s}
.cell.fill{border-color:var(--muted)}
.cell.g{background:var(--green);border-color:var(--green);color:#fff;animation:pop .3s}
.cell.y{background:var(--yellow);border-color:var(--yellow);color:#fff;animation:pop .3s}
.cell.x{background:var(--gray);border-color:var(--gray);color:#aaa;animation:pop .3s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kb{display:grid;gap:6px;max-width:480px;width:100%}
.kb .r1,.kb .r2,.kb .r3{display:flex;gap:6px;justify-content:center}
.kb button{font-family:"Consolas",monospace;font-size:16px;font-weight:700;padding:12px 0;min-width:40px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);cursor:pointer;transition:.15s;flex:1;text-transform:uppercase}
.kb button:hover{background:#232342}
.kb button.g{background:var(--green);border-color:var(--green);color:#fff}
.kb button.y{background:var(--yellow);border-color:var(--yellow);color:#fff}
.kb button.x{background:var(--gray);border-color:var(--gray);color:#777}
.kb button.wide{flex:1.8}
#msg{min-height:26px;font-family:"Consolas",monospace;font-size:15px;color:var(--neon);margin:10px 0;letter-spacing:.05em}
#msg.err{color:#ff4d6d}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;backdrop-filter:blur(4px);z-index:5}
#overlay.show{display:flex}
#overlay h2{font-size:clamp(28px,6vw,44px);color:var(--neon);text-shadow:0 0 30px rgba(102,255,160,.5)}
#overlay p{color:var(--muted);font-size:18px;letter-spacing:.2em;font-family:"Consolas",monospace}
#overlay button{font-family:"Consolas",monospace;font-size:15px;letter-spacing:.15em;padding:12px 28px;background:transparent;border:2px solid var(--neon);color:var(--neon);border-radius:8px;cursor:pointer}
#overlay button:hover{background:var(--neon);color:var(--bg)}
@media(max-width:560px){
  .board{grid-template-rows:repeat(6,48px)}
  .row{grid-template-columns:repeat(5,48px)}
  .cell{font-size:22px}
  .kb button{font-size:13px;padding:10px 0;min-width:32px}
}
</style>
</head>
<body>
<h1>WORDLE</h1>
<div class="stats">
  <span>Win streak <b id="streak">0</b></span>
  <span>Best streak <b id="best">0</b></span>
  <span>Played <b id="played">0</b></span>
</div>
<div class="board" id="board"></div>
<div id="msg"></div>
<div class="kb" id="kb">
  <div class="r1"><button data-k="q">q</button><button data-k="w">w</button><button data-k="e">e</button><button data-k="r">r</button><button data-k="t">t</button><button data-k="y">y</button><button data-k="u">u</button><button data-k="i">i</button><button data-k="o">o</button><button data-k="p">p</button></div>
  <div class="r2"><button data-k="a">a</button><button data-k="s">s</button><button data-k="d">d</button><button data-k="f">f</button><button data-k="g">g</button><button data-k="h">h</button><button data-k="j">j</button><button data-k="k">k</button><button data-k="l">l</button></div>
  <div class="r3"><button data-k="enter" class="wide">enter</button><button data-k="z">z</button><button data-k="x">x</button><button data-k="c">c</button><button data-k="v">v</button><button data-k="b">b</button><button data-k="n">n</button><button data-k="m">m</button><button data-k="back" class="wide">⌫</button></div>
</div>
<div id="overlay">
  <h2 id="ovTitle">YOU WIN!</h2>
  <p id="ovSub"></p>
  <button id="playAgain">PLAY AGAIN</button>
</div>

  'trial','tribe','trick','troop','truck','truly','trump','trunk','trust','truth',
  'tulip','tuned','twice','twist','ultra','under','unify','union','unite','unity',
  'until','upper','upset','urban','usage','useful','usual','utter','vague','valid',
  'value','vapor','vault','vegan','venus','verse','video','villa','vinyl','viral',
  'virus','visa','visit','vital','vivid','vocal','vodka','voice','voter','vouch',
  'wagon','waist','waste','watch','water','weary','weave','wedge','weigh','weird',
  'whale','wharf','wheat','wheel','where','while','whine','whisk','whole','whose',
  'widow','width','witch','woman','world','worry','worse','worst','worth','would',
  'wound','woven','wreck','wrist','write','wrong','xenon','yacht','yield','young',
  'youth','zebra','zesty','zonal','zoom'
];
const ROWS=6,COLS=5;
let answer,row,col,win,gameOver;
let stats=loadStats();
const boardEl=document.getElementById('board'),msgEl=document.getElementById('msg');

function loadStats(){
  try{return JSON.parse(localStorage.getItem('wordle_stats')||'{"streak":0,"best":0,"played":0,"wins":0}')}catch(e){return{streak:0,best:0,played:0,wins:0}}
}
function saveStats(){localStorage.setItem('wordle_stats',JSON.stringify(stats))}
function pickAnswer(){
  const day=Math.floor(Date.now()/86400000);
  return WORDS[day%WORDS.length];
}
function buildBoard(){
  boardEl.innerHTML='';
  for(let r=0;r<ROWS;r++){
    const rowDiv=document.createElement('div');rowDiv.className='row';
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');d.className='cell';d.id='c'+r+'-'+c;
      rowDiv.appendChild(d);
    }
    boardEl.appendChild(rowDiv);
  }
}
function init(){
  answer=pickAnswer();row=0;col=0;win=false;gameOver=false;
  buildBoard();updateStats();setMsg('','');
  document.getElementById('overlay').classList.remove('show');
  document.querySelectorAll('.kb button').forEach(b=>b.className=b.className.replace(/ g| y| x/g,''));
}
function updateStats(){
  document.getElementById('streak').textContent=stats.streak;
  document.getElementById('best').textContent=stats.best;
  document.getElementById('played').textContent=stats.played;
}
function setMsg(t,isErr){msgEl.textContent=t;msgEl.className=isErr?'err':''}
function cellEl(r,c){return document.getElementById('c'+r+'-'+c)}
function currentGuess(){let s='';for(let c=0;c<col;c++)s+=cellEl(row,c).textContent;return s}
function type(letter){
  if(gameOver)return;
  if(col<COLS){cellEl(row,col).textContent=letter;cellEl(row,col).classList.add('fill');col++}
}
function backspace(){
  if(gameOver)return;
  if(col>0){col--;cellEl(row,col).textContent='';cellEl(row,col).classList.remove('fill')}
}
function submit(){
  if(gameOver)return;
  if(col<COLS){setMsg('Not enough letters',true);return}
  const guess=currentGuess().toLowerCase();
  if(!WORDS.includes(guess)){setMsg('Not in word list',true);const rd=boardEl.children[row];rd.classList.add('shake');setTimeout(()=>rd.classList.remove('shake'),400);return}
  const remaining=answer.split('');
  const result=Array(COLS).fill('x');
  // exact matches first
  for(let c=0;c<COLS;c++){
    if(guess[c]===remaining[c]){result[c]='g';remaining[c]='-';}
  }
  for(let c=0;c<COLS;c++){
    if(result[c]!=='g'){
      const idx=remaining.indexOf(guess[c]);
      if(idx>-1){result[c]='y';remaining[idx]='-';}
    }
  }
  for(let c=0;c<COLS;c++){
    const el=cellEl(row,c);
    el.classList.remove('fill');el.classList.add(result[c]);
    const btn=document.querySelector('.kb button[data-k="'+guess[c]+'"]');
    const cur=btn.className;
    if(result[c]==='g'||cur.includes('g'))btn.className='kb g';
    else if(result[c]==='y'&&!cur.includes('y'))btn.className='kb y';
    else if(result[c]==='x'&&!(cur.includes('g')||cur.includes('y')))btn.className='kb x';
  }
  if(guess===answer){
    win=true;endGame();
    return;
  }
  row++;
  if(row>=ROWS){endGame();return}
  col=0;
}
function endGame(){
  gameOver=true;
  stats.played++;
  if(win){
    stats.wins++;stats.streak++;
    if(stats.streak>stats.best)stats.best=stats.streak;
  }else{
    stats.streak=0;
  }
  saveStats();updateStats();
  document.getElementById('ovTitle').textContent=win?'YOU WIN!':'GAME OVER';
  document.getElementById('ovSub').textContent=(win?'Solved in '+(row+1)+'/6': 'Answer: '+answer.toUpperCase());
  setTimeout(()=>document.getElementById('overlay').classList.add('show'),600);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter')submit();
  else if(e.key==='Backspace')backspace();
  else if(/^[a-zA-Z]$/.test(e.key))type(e.key.toLowerCase());
});
document.querySelectorAll('.kb button').forEach(b=>{
  b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(k==='enter')submit();
    else if(k==='back')backspace();
    else type(k);
  });
});
document.getElementById('playAgain').addEventListener('click',init);
init();
</script>
</body>
</html>
